server.modules = (
    "mod_rewrite",
    "mod_proxy",
    "mod_access",
    "mod_accesslog",
)

server.port = 80
server.document-root = "/app/html"

server.errorlog = "/dev/stderr"
accesslog.filename = "/dev/stdout"

index-file.names = ( "index.html" )

mimetype.assign = (
    ".html"  => "text/html",
    ".css"   => "text/css",
    ".js"    => "text/javascript",
    ".mjs"   => "text/javascript",
    ".json"  => "application/json",
    ".svg"   => "image/svg+xml",
    ".png"   => "image/png",
    ".ico"   => "image/x-icon",
    ".woff"  => "font/woff",
    ".woff2" => "font/woff2",
    ".ttf"   => "font/ttf",
    ".eot"   => "application/vnd.ms-fontobject",
    ".txt"   => "text/plain",
    ""       => "application/octet-stream",
)

# SPA history-mode fallback: any non-file path outside /api/ serves the app.
url.rewrite-if-not-file = ( "^/(?!api/).*$" => "/index.html" )

# AskOwl API: reverse-proxy /api/* to the backend service, mapping the
# /api prefix away on the proxied request line (host/port are substituted
# by the entrypoint from PROXY_HOST/PROXY_PORT).
$HTTP["url"] =~ "^/api/" {
    proxy.server = ( "" => ( ( "host" => "__PROXY_HOST__", "port" => __PROXY_PORT__ ) ) )
    proxy.header = ( "map-urlpath" => ( "/api/" => "/" ) )
}

# Stream backend responses as they arrive (SSE) and allow quiet streams.
server.stream-response-body = 1
server.max-read-idle = 300
server.max-write-idle = 300
